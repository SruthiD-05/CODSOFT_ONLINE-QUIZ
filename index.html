<!DOCTYPE html>
<html>
<head>
<title>Online Quiz App</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="quiz-container">

<h1>Online Quiz</h1>

<div id="question">Question text</div>

<div class="options">

<button class="option" onclick="selectAnswer(0)"></button>
<button class="option" onclick="selectAnswer(1)"></button>
<button class="option" onclick="selectAnswer(2)"></button>
<button class="option" onclick="selectAnswer(3)"></button>

</div>

<button id="nextBtn" onclick="nextQuestion()">Next Question</button>

<div id="result"></div>

<button id="restartBtn" onclick="restartQuiz()">Restart Quiz</button>

</div>

<script src="script.js"></script>

</body>
</html>
